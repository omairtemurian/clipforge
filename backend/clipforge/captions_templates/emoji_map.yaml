# Keyword -> emoji that captions add after the keyword (SPEC 6.9). Keys are
# lowercase single words, matched against a caption word in lowercase without
# punctuation. Each value is one emoji character, followed by VARIATION
# SELECTOR-16 where Unicode's fully-qualified form has it (no ZWJ sequences,
# keycaps or flags), that the bundled Noto Emoji font has a glyph for.
# Everyday words (think, look, time, work, okay...) are left out so that
# emoji stay rare.


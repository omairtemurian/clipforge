# Hand-drawn marker words with a dark outline; the spoken word is yellow.
font: Permanent Marker
size: 58
primary_color: "#FFFFFF"
highlight_color: "#FFE14D"
emphasis_color: "#FF7A59"
outline: 4
outline_color: "#1C1917"
shadow: 0
box: false
uppercase: false
position: lower_third
max_words_per_line: 3
max_lines: 1
animation: pop
emoji: false

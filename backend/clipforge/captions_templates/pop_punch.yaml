# Two uppercase words at a time; the spoken word pops in lime and grows to full size.
font: Montserrat ExtraBold
size: 62
primary_color: "#FFFFFF"
highlight_color: "#C6FF00"
emphasis_color: "#FF3D7F"
outline: 3.7
outline_color: "#000000"
shadow: 1.9
box: false
uppercase: true
position: lower_third
max_words_per_line: 2
max_lines: 1
animation: pop
emoji: true

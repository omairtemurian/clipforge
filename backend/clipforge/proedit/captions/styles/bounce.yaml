# Bounce: the spoken word jumps above its size and settles back.
motion: bounce
glow: false
caption:
  font: Titan One
  size: 66
  primary_color: "#FFFFFF"
  highlight_color: "#FF3B30"
  emphasis_color: "#FFE600"
  outline: 4.5
  outline_color: "#000000"
  shadow: 2
  box: false
  uppercase: true
  position: lower_third
  max_words_per_line: 3
  max_lines: 1
  emoji: false

# Pop: each word pops in as it is spoken, bold white capitals, the spoken word yellow.
motion: pop
glow: false
caption:
  font: Montserrat ExtraBold
  size: 64
  primary_color: "#FFFFFF"
  highlight_color: "#FFE600"
  emphasis_color: "#39FF14"
  outline: 4
  outline_color: "#000000"
  shadow: 2
  box: false
  uppercase: true
  position: lower_third
  max_words_per_line: 3
  max_lines: 1
  emoji: false

# Lime block letters rise into place with a soft whoosh and a gentle zoom.
label: Neon Rise
description: Lime block letters rise into place with a soft whoosh.
duration: 2.5
uppercase: true
max_chars_per_line: 13
layers:
  - text: "{text}"
    font: Bungee
    size: 0.045
    color: "#C6FF00"
    stroke: "#000000"
    stroke_width: 0.08
    y: 0.25
    animation_in: slide_up
    animation_out: fade
    in_seconds: 0.4
    out_seconds: 0.3
punch:
  scale: 1.14
  attack: 0.4
  release: 0.4
sound: whoosh_soft.flac
sound_volume: 0.7
